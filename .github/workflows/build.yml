name: Build personal APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect compose sources
        run: |
          set -x
          M=https://dl.google.com/dl/android/maven2/androidx/compose
          for B in compose-bom-beta/2026.10.01/compose-bom-beta-2026.10.01 compose-bom/2026.10.01/compose-bom-2026.10.01 compose-bom/2026.11.00/compose-bom-2026.11.00 compose-bom-beta/2026.11.00/compose-bom-beta-2026.11.00; do
            echo "== $B"; curl -sf $M/$B.pom | grep -A1 "<artifactId>foundation</artifactId>" || echo none
          done
          V=$(curl -sf $M/compose-bom-beta/2026.10.01/compose-bom-beta-2026.10.01.pom | grep -A1 "<artifactId>foundation</artifactId>" | grep -o "<version>[^<]*" | cut -d'>' -f2)
          echo "foundation=$V"
          curl -sf $M/foundation/foundation/maven-metadata.xml | grep -o "<version>[^<]*" | tail -15
          curl -sfo s.jar $M/foundation/foundation/$V/foundation-$V-sources.jar || curl -sfo s.jar $M/foundation/foundation-android/$V/foundation-android-$V-sources.jar
          mkdir s && cd s && unzip -q ../s.jar
          F=$(find . -name LazyGridSpanLayoutProvider.kt | head -1); cat -n $F | sed -n 60,200p
          F=$(find . -name LazyGridMeasuredLineProvider.kt | head -1); cat -n $F
          F=$(find . -path "*lazy/grid/LazyGrid.kt" | head -1); grep -n "keepAround" $F; cat -n $F | sed -n 480,620p
